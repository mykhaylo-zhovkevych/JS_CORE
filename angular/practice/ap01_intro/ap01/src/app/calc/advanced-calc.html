<section class="w-md rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
  <h2 class="mb-4 text-lg font-semibold text-slate-800">Advanced</h2>

  <div class="mb-4 flex gap-2">
    <input type="number" [(ngModel)]="calc.first"
           class="w-full rounded-md border border-slate-300 px-3 py-2 text-right tabular-nums focus:outline-none focus:ring-2 focus:ring-emerald-200" />
    <input type="number" [(ngModel)]="calc.second"
           class="w-full rounded-md border border-slate-300 px-3 py-2 text-right tabular-nums focus:outline-none focus:ring-2 focus:ring-emerald-200" />
  </div>

  <p class="mb-1 text-xs font-medium uppercase tracking-wide text-slate-500">Binary</p>
  <div class="mb-4 flex flex-wrap gap-2">
    @for (op of calc.operations; track op) {
      <button (click)="calc.calculate(op)"
              class="min-w-12 rounded-md bg-emerald-600 px-3 py-2 font-mono text-white transition hover:bg-emerald-700 active:scale-95">
        {{ op }}
      </button>
    }
  </div>

  <p class="mb-1 text-xs font-medium uppercase tracking-wide text-slate-500">On result</p>
  <div class="mb-4 flex flex-wrap gap-2">
    @for (op of calc.unaryOperations; track op) {
       <!-- DOM/component property -->
      <button (click)="calc.apply(op)" [disabled]="calc.last === undefined"
              class="min-w-12 rounded-md bg-slate-700 px-3 py-2 font-mono text-white transition hover:bg-slate-800 active:scale-95 disabled:cursor-not-allowed disabled:opacity-40">
        {{ op }}
      </button>
    }
  </div>

  <div class="mb-4 flex items-center gap-2">
    <button (click)="calc.memoryRecall()" class="rounded-md bg-amber-500 px-3 py-1.5 text-sm font-medium text-white hover:bg-amber-600">MR</button>
    <button (click)="calc.memoryClear()"  class="rounded-md bg-amber-500 px-3 py-1.5 text-sm font-medium text-white hover:bg-amber-600">MC</button>
    <button (click)="calc.clear()"        class="rounded-md bg-red-500 px-3 py-1.5 text-sm font-medium text-white hover:bg-red-600">C</button>
    <!-- property binding needs signal-->
    <span [title]="'memory: ' + calc.memoryValue" class="ml-auto font-mono text-sm text-slate-500">
    </span>
  </div>

  <!-- class binding: toggles a css class from a boolean -->
  <p [class.text-slate-400]="calc.last === undefined"
     class="mb-4 rounded-md bg-slate-100 px-3 py-2 text-right font-mono text-xl tabular-nums text-slate-900">
    {{ calc.last ?? '—' }}
  </p>

  @if (calc.history.length) {
    <ol class="max-h-40 space-y-1 overflow-y-auto rounded-md border border-slate-200 p-3 font-mono text-sm text-slate-600">
      @for (line of calc.history; track $index) {
        <li class="flex gap-2">
          <span class="w-5 text-right text-slate-400">{{ $index + 1 }}.</span>
          <span>{{ line }}</span>
        </li>
      }
    </ol>
  }
</section>
