<div class="object-list">
  <!-- @for replaces *ngFor (no CommonModule import needed) -->
  <!--  scope would actively taken into account-->
  @for (item of myObjects(); track item.id) {
    <div (click)="redirectTo(item.id)" class="object-list__item">
      <span>{{ item.title }}</span>
    </div>
  } @empty {
    <p>No objects.</p>
  }
</div>
